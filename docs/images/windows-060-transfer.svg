<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="微信“聊天记录管理”：选对传输方向">
<rect width="1100" height="440" rx="20" fill="#f4f7fc"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="38" y="55" font-size="28" font-weight="bold" fill="#15304c">微信“聊天记录管理”：选对传输方向</text>
<text x="38" y="90" font-size="17" fill="#526981">根据所提供页面重绘；具体菜单入口以本人微信版本为准</text>
<rect x="38" y="120" width="326" height="238" rx="14" fill="white" stroke="#dce4ef"/>
<rect x="38" y="120" width="326" height="6" rx="3" fill="#2563eb"/>
<text x="58" y="161" font-size="21" font-weight="bold" fill="#2563eb">导入聊天记录</text>
<text x="58" y="198" font-size="17" fill="#263e55">手机 → 电脑</text>
<text x="58" y="230" font-size="17" fill="#263e55">准备来源记录时使用</text>
<text x="58" y="262" font-size="17" fill="#263e55">手机 B 导入电脑 B</text>
<text x="58" y="294" font-size="17" fill="#263e55">等完成后检查目标单聊</text>
<rect x="384" y="120" width="326" height="238" rx="14" fill="white" stroke="#dce4ef"/>
<rect x="384" y="120" width="326" height="6" rx="3" fill="#008578"/>
<text x="404" y="161" font-size="21" font-weight="bold" fill="#008578">导出聊天记录</text>
<text x="404" y="198" font-size="17" fill="#263e55">电脑 → 手机</text>
<text x="404" y="230" font-size="17" fill="#263e55">A 电脑恢复并验收之后使用</text>
<text x="404" y="262" font-size="17" fill="#263e55">电脑 A 导出至手机 A</text>
<text x="404" y="294" font-size="17" fill="#263e55">手机结果仍须单独核对</text>
<rect x="730" y="120" width="326" height="238" rx="14" fill="white" stroke="#dce4ef"/>
<rect x="730" y="120" width="326" height="6" rx="3" fill="#7650b3"/>
<text x="750" y="161" font-size="21" font-weight="bold" fill="#7650b3">备份与恢复</text>
<text x="750" y="198" font-size="17" fill="#263e55">微信官方备份流程</text>
<text x="750" y="230" font-size="17" fill="#263e55">备份包不是本工具账号库</text>
<text x="750" y="262" font-size="17" fill="#263e55">不要把 Backup / RMFH 包</text>
<text x="750" y="294" font-size="17" fill="#263e55">选作 db_storage 目录</text>
<text x="38" y="403" font-size="16" fill="#526981">手机和电脑应登录同一个本人账号；工具不会把恢复结果自动同步到手机。</text>
</g></svg>